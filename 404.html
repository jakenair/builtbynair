<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Page not found — Built by Nair</title>
<meta name="robots" content="noindex">
<link rel="icon" href="/favicon.svg" type="image/svg+xml">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Newsreader:opsz,wght@6..72,400;6..72,500&family=IBM+Plex+Sans:wght@400;500&display=swap">
<style>
  :root{
    --bg:#F4F5F6; --text:#0F1418; --text-2:#3D4650; --accent:#1D3F6E; --line-2:#C8CDD4;
  }
  @media (prefers-color-scheme: dark){
    :root{ --bg:#0C0F12; --text:#ECEEF1; --text-2:#B4BCC5; --accent:#89ACDD; --line-2:#323A45; }
  }
  *{box-sizing:border-box;}
  html,body{margin:0; padding:0;}
  body{
    background:var(--bg); color:var(--text);
    font-family:'IBM Plex Sans', system-ui, -apple-system, sans-serif;
    min-height:100vh; display:flex; align-items:center; justify-content:center;
    padding:32px 20px; line-height:1.62;
  }
  main{max-width:34rem;}
  h1{
    font-family:'Newsreader', Georgia, serif; font-weight:400;
    font-size:clamp(30px,6vw,46px); letter-spacing:-0.02em;
    line-height:1.1; margin:0 0 14px;
  }
  p{color:var(--text-2); margin:0 0 26px; font-size:17px;}
  a.btn{
    display:inline-flex; align-items:center; padding:12px 22px;
    border:1px solid var(--line-2); border-radius:3px;
    color:var(--text); text-decoration:none; font-size:15px; font-weight:500;
  }
  a.btn:hover{border-color:var(--text);}
  .mark{
    font-family:'Newsreader', Georgia, serif; font-size:16px;
    color:var(--text-2); margin:0 0 28px; display:block;
  }
</style>
</head>
<body>
  <main>
    <span class="mark">Built by Nair</span>
    <h1>That page doesn't exist.</h1>
    <p>The link may be out of date, or the address mistyped. Everything on this site lives on one page.</p>
    <a class="btn" href="/">Back to the site</a>
  </main>
</body>
</html>
